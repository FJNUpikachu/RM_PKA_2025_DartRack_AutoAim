/**:
  ros__parameters:
    # 运行模式: camera(相机输入) 或 video(视频文件输入)
    mode: "camera"
    
    # 图像话题名称
    image_topic: "image_raw"
    
    # 视频模式参数（仅mode为"video"时生效）
    video_path: "path/to/your/video.mp4"
    video_fps: 30.0
    
    # ── RGB 检测参数（替换原 HSV）──────────────────────────────────────────
    # 目标特性：外圈纯绿 + 中心白色高亮（低曝光 LED 典型特征）
    #
    # green_diff_thresh: G - max(R,B) 差值阈值
    #   用于提取纯绿光晕区域。值越小，捕获越灵敏（暗场景调小）。
    #   推荐调参范围: 15 ~ 50
    green_diff_thresh: 25.0
    
    # green_abs_thresh: G 通道绝对亮度阈值
    #   用于提取中心白色高亮区域（三通道均亮时 G 仍最强）。
    #   推荐调参范围: 50 ~ 150（场景越暗越小）
    green_abs_thresh: 70.0
    
    # blur_ksize: 预处理高斯模糊核大小（必须为奇数）
    #   用于抑制噪点，使灯光区域更连续。
    #   推荐: 3（噪点少）~ 7（噪点多）
    blur_ksize: 5
    
    # ── ROI 区域 ──────────────────────────────────────────────────────────
    # y_min/y_max 均为 0 时使用全图（不裁剪）
    y_min: 0
    y_max: 0
    
    # ── 形状筛选参数 ──────────────────────────────────────────────────────
    # 外接矩形长宽比上限（越接近 1 越圆，引导灯近似圆形）
    aspect_ratio_threshold: 1.5
    
    # 圆形度下限 [0,1]（越接近 1 越圆）
    # 注：灯晕边缘略不规则，建议不低于 0.60
    circularity_threshold: 0.65
    
    # ── 圆形目标尺寸范围（等效圆半径，单位：像素）─────────────────────────
    # 根据实际引导灯在图像中的大小调整
    min_radius: 3.0
    max_radius: 100.0
    
    # 调试模式（true：输出调试日志；false：精简输出）
    enable_debug: false